<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blackjack Game</title>
    <script src="../js/blackJack.js"></script>
    <link rel="stylesheet" href="../styles/style.css">
</head>
<body>
     <header class="heading">
            <img src="../images/logo.png" class="logo">
            <h1 class="title">BLACK JACK </h1>
     </header>  
    
    <div class="game-wrapper">
        <div class="table-area">
            <section class="dealer">
                <h2>Dealer <span id="dealer-score">(Score: 0)</span></h2>
                <div class="dealer-cards" id="dealer-cards">
                </div>
            </section>

            <section class="player">
                <h2>Player <span id="player-score">(Score: 0)</span></h2>
                <div class="player-cards" id="player-cards">
                </div>
            </section>

            <div class="result-message" id="result-message"></div>
        </div>

        <div class="controls-right" aria-hidden="false">
            <div class="user-panel">
                <div id="user-display">Not logged in</div>
                <button class="logout-button" id="logout-btn" onclick="logoutUser()">Logout</button>
            </div>
            <button class="play_button" onclick="startNewGame()">New Game</button>
            <div class="game-actions-vertical">
                <button class="action-button" id="hit-btn" onclick="playerHit()" disabled>Hit</button>
                <button class="action-button" id="stand-btn" onclick="playerStand()" disabled>Stand</button>
            </div>
        </div>
    </div>
    
</body>
</html>
